[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperlens-core"
version = "1.0.0"
description = "PaperLens core: document understanding, evidence retrieval and language analysis for academic papers"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zilai Wang" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "lxml>=5,<6",
  "pdfplumber>=0.11,<1",
  "pymupdf>=1.24,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
paperlens-core = "paperlens_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paperlens_core"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
