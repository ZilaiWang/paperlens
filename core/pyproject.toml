[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paperlens-core"
version = "1.2.0"
description = "PaperLens core: document understanding, evidence retrieval and language analysis for academic papers"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Zilai Wang" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "lxml>=5,<6",
  "pdfplumber>=0.11,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
pymupdf = [
  "pymupdf>=1.24,<2",
]
server = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
paperlens-core = "paperlens_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["paperlens_core"]
