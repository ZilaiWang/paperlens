# 原版 PDF 端点可缓存 1 小时（浏览器预取后点"原版"秒开），其余 /api 不缓存
map $request_uri $api_cache_control {
    default "no-store";
    ~*^/api/papers/[^/]+/pdf$ "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        # 批量核验等长任务可跑 1-2 分钟（默认 60s 会掐断）
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $api_cache_control always;
    }

    # static assets are content-hashed: long cache is safe
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML must never be cached, otherwise page updates never arrive
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        add_header Cache-Control "no-cache" always;
    }
}
